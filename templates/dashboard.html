<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskPro - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">TaskPro</span>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container">
  <div id="alert"></div>
  <div class="row">
    <!-- Form -->
    <div class="col-md-4 mb-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 id="form-title">Add Task</h5>
          <form onsubmit="saveTask(event)">
            <input type="hidden" id="task-id">
            <input class="form-control mb-2" id="title" placeholder="Title" required>
            <textarea class="form-control mb-2" id="description" placeholder="Description" rows="3"></textarea>
            <input class="form-control mb-2" id="due_date" type="date" required>
            <select class="form-select mb-2" id="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
            <select class="form-select mb-3" id="status">
              <option value="pending" selected>Pending</option>
              <option value="completed">Completed</option>
            </select>
            <button class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-secondary" onclick="resetForm()">Clear</button>
          </form>
        </div>
      </div>
    </div>

    <!-- List -->
    <div class="col-md-8">
      <div class="row g-2 mb-3">
        <div class="col-md-5"><input class="form-control" id="f-search" placeholder="Search by title" oninput="loadTasks()"></div>
        <div class="col-md-3">
          <select class="form-select" id="f-status" onchange="loadTasks()">
            <option value="">All</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="col-md-4">
          <select class="form-select" id="f-priority" onchange="loadTasks()">
            <option value="">All priorities</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
      <div id="task-list"></div>
    </div>
  </div>
</div>

<script>
const token = localStorage.getItem('access');
if (!token) location.href = '/';

const headers = () => ({'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token});

function logout() { localStorage.removeItem('access'); location.href = '/'; }

function showAlert(msg, type) {
  document.getElementById('alert').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => document.getElementById('alert').innerHTML = '', 4000);
}

function formatErrors(data) {
  if (data.detail) return data.detail;
  return Object.entries(data).map(([k, v]) => `${k}: ${[].concat(v).join(' ')}`).join('<br>');
}

async function api(url, options = {}) {
  const res = await fetch(url, {headers: headers(), ...options});
  if (res.status === 401) { logout(); return null; }
  return res;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function loadTasks() {
  const p = new URLSearchParams();
  const search = document.getElementById('f-search').value;
  const status = document.getElementById('f-status').value;
  const priority = document.getElementById('f-priority').value;
  if (search) p.set('search', search);
  if (status) p.set('status', status);
  if (priority) p.set('priority', priority);

  const res = await api('/api/tasks/?' + p.toString());
  if (!res) return;
  const tasks = await res.json();
  const badge = {low: 'success', medium: 'warning', high: 'danger'};

  document.getElementById('task-list').innerHTML = tasks.length ? tasks.map(t => `
    <div class="card mb-2 shadow-sm">
      <div class="card-body d-flex justify-content-between align-items-start">
        <div>
          <h6 class="${t.status === 'completed' ? 'text-decoration-line-through text-muted' : ''}">${esc(t.title)}</h6>
          <p class="mb-1 small">${esc(t.description)}</p>
          <span class="badge bg-${badge[t.priority]}">${t.priority}</span>
          <span class="badge bg-secondary">Due ${t.due_date}</span>
          <span class="badge bg-${t.status === 'completed' ? 'success' : 'info'}">${t.status}</span>
        </div>
        <div class="btn-group btn-group-sm">
          ${t.status !== 'completed' ? `<button class="btn btn-outline-success" onclick="complete(${t.id})">Done</button>` : ''}
          <button class="btn btn-outline-primary" onclick='editTask(${JSON.stringify(t).replace(/'/g, "&#39;")})'>Edit</button>
          <button class="btn btn-outline-danger" onclick="deleteTask(${t.id})">Delete</button>
        </div>
      </div>
    </div>`).join('') : '<p class="text-muted">No tasks found.</p>';
}

async function saveTask(e) {
  e.preventDefault();
  const id = document.getElementById('task-id').value;
  const body = {
    title: document.getElementById('title').value,
    description: document.getElementById('description').value,
    due_date: document.getElementById('due_date').value,
    priority: document.getElementById('priority').value,
    status: document.getElementById('status').value,
  };
  const res = await api(id ? `/api/tasks/${id}/` : '/api/tasks/', {
    method: id ? 'PUT' : 'POST',
    body: JSON.stringify(body),
  });
  if (!res) return;
  const data = await res.json();
  if (res.ok) {
    showAlert(id ? 'Task updated.' : 'Task created.', 'success');
    resetForm();
    loadTasks();
  } else {
    showAlert(formatErrors(data), 'danger');
  }
}

function editTask(t) {
  document.getElementById('form-title').textContent = 'Edit Task';
  document.getElementById('task-id').value = t.id;
  document.getElementById('title').value = t.title;
  document.getElementById('description').value = t.description;
  document.getElementById('due_date').value = t.due_date;
  document.getElementById('priority').value = t.priority;
  document.getElementById('status').value = t.status;
  window.scrollTo(0, 0);
}

function resetForm() {
  document.getElementById('form-title').textContent = 'Add Task';
  document.getElementById('task-id').value = '';
  ['title', 'description', 'due_date'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('priority').value = 'medium';
  document.getElementById('status').value = 'pending';
}

async function complete(id) {
  const res = await api(`/api/tasks/${id}/`, {method: 'PATCH', body: JSON.stringify({status: 'completed'})});
  if (res && res.ok) { showAlert('Task marked as completed.', 'success'); loadTasks(); }
}

async function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  const res = await api(`/api/tasks/${id}/`, {method: 'DELETE'});
  if (res && res.ok) { showAlert('Task deleted.', 'success'); loadTasks(); }
}

loadTasks();
</script>
</body>
</html>
