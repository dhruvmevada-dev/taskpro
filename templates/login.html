<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskPro - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width:420px; margin-top:80px;">
  <h2 class="text-center mb-4">TaskPro</h2>
  <div id="alert"></div>

  <div class="card shadow-sm">
    <div class="card-body">
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" id="tab-login" onclick="show('login')">Login</button></li>
        <li class="nav-item"><button class="nav-link" id="tab-register" onclick="show('register')">Register</button></li>
      </ul>

      <form id="login-form" onsubmit="login(event)">
        <input class="form-control mb-3" id="l-username" placeholder="Username" required>
        <input class="form-control mb-3" id="l-password" type="password" placeholder="Password" required>
        <button class="btn btn-primary w-100">Login</button>
      </form>

      <form id="register-form" class="d-none" onsubmit="register(event)">
        <input class="form-control mb-3" id="r-username" placeholder="Username" required>
        <input class="form-control mb-3" id="r-email" type="email" placeholder="Email">
        <input class="form-control mb-3" id="r-password" type="password" placeholder="Password (min 6 chars)" required>
        <button class="btn btn-success w-100">Register</button>
      </form>
    </div>
  </div>
</div>

<script>
if (localStorage.getItem('access')) location.href = '/dashboard/';

function show(which) {
  document.getElementById('login-form').classList.toggle('d-none', which !== 'login');
  document.getElementById('register-form').classList.toggle('d-none', which !== 'register');
  document.getElementById('tab-login').classList.toggle('active', which === 'login');
  document.getElementById('tab-register').classList.toggle('active', which === 'register');
  document.getElementById('alert').innerHTML = '';
}

function showAlert(msg, type) {
  document.getElementById('alert').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}

function formatErrors(data) {
  if (data.detail) return data.detail;
  return Object.entries(data).map(([k, v]) => `${k}: ${[].concat(v).join(' ')}`).join('<br>');
}

async function register(e) {
  e.preventDefault();
  const res = await fetch('/api/register/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      username: document.getElementById('r-username').value,
      email: document.getElementById('r-email').value,
      password: document.getElementById('r-password').value,
    }),
  });
  const data = await res.json();
  if (res.ok) {
    show('login');
    showAlert('Registration successful. Please log in.', 'success');
  } else {
    showAlert(formatErrors(data), 'danger');
  }
}

async function login(e) {
  e.preventDefault();
  const res = await fetch('/api/login/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      username: document.getElementById('l-username').value,
      password: document.getElementById('l-password').value,
    }),
  });
  const data = await res.json();
  if (res.ok) {
    localStorage.setItem('access', data.access);
    location.href = '/dashboard/';
  } else {
    showAlert(formatErrors(data), 'danger');
  }
}
</script>
</body>
</html>
